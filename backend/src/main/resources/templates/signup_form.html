<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaF Demo</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light">
	<div class="container d-flex justify-content-center align-items-center vh-100">
	    <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
	        <h4 class="mb-3 text-center">User Sign Up</h4>
		    <form th:action="@{/process_signup}" th:object="${user}"
		        method="post" style="max-width: 600px; margin: 0 auto;">
	            <div class="mb-3">
	                <label for="email" class="form-label">E-Mail Address</label>
	                <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="name@example.com" required>
	            </div>
	            <div class="mb-3">
	                <label for="password" class="form-label">Password</label>
	                <input type="password" th:field="*{password}" class="form-control" id="password" placeholder="••••••••" required>
	            </div>
	            <button type="submit" class="btn btn-primary w-100 mb-3">Sign Up</button>
				<a th:href="@{/}" class="btn btn-secondary w-100">Return to Menu</a>
	        </form>
	    </div>
	</div>
</body>
</html>
