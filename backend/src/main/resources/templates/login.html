<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Paf Demo Login</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light">
	<main class="container d-flex align-items-center justify-content-center min-vh-100">
		<div class="card shadow-sm p-4" style="max-width: 420px; width: 100%;">
			<h2 class="text-center mb-4">Paf Demo Login</h2>
			<div th:if="${param.error}" class="alert alert-danger" role="alert">
				Invalid username or password.
			</div>
			<div th:if="${param.logout}" class="alert alert-success" role="alert">
				You have been successfully logged out.
			</div>
			<form th:action="@{/login}" method="post">
				<!-- CSRF protection -->
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

				<div class="mb-3">
					<label for="username" class="form-label">E-Mail-Address</label>
					<input id="username" name="username" type="email" class="form-control"
								 required autofocus autocomplete="email">
				</div>
				<div class="mb-3">
					<label for="password" class="form-label">Password</label>
					<input id="password" name="password" type="password" class="form-control"
								 required autocomplete="current-password">
				</div>
				<button type="submit" class="btn btn-primary w-100">Login</button>
			</form>
			<hr class="my-4">
			<a th:href="@{/}" class="btn btn-secondary w-100">Return to Menu</a>
		</div>
	</main>
</body>
</html>
