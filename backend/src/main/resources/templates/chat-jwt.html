<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>PaF Demo Chat (JWT)</title>

	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		crossorigin="anonymous"
	/>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"
		defer
	></script>
	<script
		src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"
		defer
	></script>

	<!-- module for JWT WebSocket handshake -->
	<script src="/chat-jwt.js" type="module" defer></script>
</head>
<body>
	<main id="main-content" class="container py-4">
		<h1 class="h3 mb-4 d-flex align-items-center gap-2">
			PaF Demo Chat <span class="badge bg-warning text-dark">JWT</span>
		</h1>

		<!-- JWT status notes -->
		<div id="jwtNotice" class="alert alert-warning d-none" role="alert">
			Kein JWT gefunden. Bitte zuerst über „Login (JWT)“ anmelden.
		</div>

		<div class="row g-3 align-items-end">
			<!-- connection -->
			<section class="col-md-6">
				<div class="d-flex gap-2 align-items-center">
					<label class="form-label mb-0" for="connectBtn">WebSocket:</label>
					<button id="connectBtn" type="button" class="btn btn-primary">Connect</button>
					<button id="disconnectBtn" type="button" class="btn btn-outline-secondary" disabled>Disconnect</button>
				</div>
			</section>

			<!-- send message -->
			<section class="col-md-6">
				<div class="input-group">
					<label class="input-group-text" for="messageInput">Message</label>
					<input
						id="messageInput"
						type="text"
						class="form-control"
						placeholder="Your message here…"
						autocomplete="off"
						enterkeyhint="send"
					/>
					<button id="sendBtn" type="button" class="btn btn-success" disabled>Send</button>
				</div>
			</section>
		</div>

		<!-- messages list -->
		<section class="row mt-4">
			<div class="col-12">
				<div id="conversation" class="card" hidden>
					<div class="card-header">Messages</div>
					<div class="card-body p-0">
						<ul
							id="messagesList"
							class="list-group list-group-flush overflow-auto"
							style="max-height: 50vh;"
							role="log"
						></ul>
					</div>
				</div>
			</div>
		</section>

		<a th:href="@{ / }" class="btn btn-secondary w-100 mt-3">Return to Menu</a>
	</main>
</body>
</html>
