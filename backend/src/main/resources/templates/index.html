<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaF Demo</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
	<div class="container text-center" style="max-width: 400px;">
	    <h1 class="mb-4">PaF Demo</h1>
		<div th:if="${param.alreadyLoggedIn}" class="alert alert-success" role="alert">
			You are already logged in.
		</div>
	    <a th:href="@{/signup}" class="btn btn-primary btn-lg d-block w-100 mb-3">Sign Up</a>
	    <a th:href="@{/login}" class="btn btn-success btn-lg d-block w-100 mb-3">Sign In</a>
	    <a th:href="@{/hello}" class="btn btn-info btn-lg d-block w-100 mb-3">Hello World (Session)</a>
		<a th:href="@{/chat}" class="btn btn-info btn-lg d-block w-100 mb-3">Chat (Session)</a>
		<a th:href="@{/hello-jwt}" class="btn btn-warning btn-lg d-block w-100 mb-3">Hello World (JWT)</a>
		<a th:href="@{/chat-jwt}" class="btn btn-warning btn-lg d-block w-100 mb-3">Chat (JWT)</a>
		<form th:action="@{/logout}" method="post">
		  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
		  <button type="submit" class="btn btn-outline-secondary btn-lg d-block w-100 mb-3">Logout</button>
		</form>
		<button id="jwtLogoutBtn" type="button" class="btn btn-outline-secondary btn-lg d-block w-100">Logout (JWT)</button>
		<script>
			document.getElementById('jwtLogoutBtn')?.addEventListener('click', () => {
				try { window.stompJwtDeactivate?.(); } catch(e) {} //disconnect STOMPClient if still active (in another tab)
				sessionStorage.removeItem('accessToken');		   //delete token -> logout (server has nothing to do)
				alert('JWT deleted.');
			});
		</script>
	</div>
</body>
</html>
