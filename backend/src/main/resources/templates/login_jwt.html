<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Paf Demo Login (Session & JWT)</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light">
<main class="container d-flex align-items-center justify-content-center min-vh-100">
	<div class="card shadow-sm p-4" style="max-width: 520px; width: 100%;">
		<h2 class="text-center mb-3">Paf Demo Login</h2>

		<div th:if="${param.error}" class="alert alert-danger" role="alert">
			Invalid username or password.
		</div>
		<div th:if="${param.logout}" class="alert alert-success" role="alert">
			You have been successfully logged out.
		</div>

		<!-- Tabs -->
		<ul class="nav nav-tabs mb-3" role="tablist">
			<li class="nav-item" role="presentation">
				<button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-session" type="button" role="tab">
					Session Login (Thymeleaf)
				</button>
			</li>
			<li class="nav-item" role="presentation">
				<button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-jwt" type="button" role="tab">
					JWT Login (API)
				</button>
			</li>
		</ul>

		<div class="tab-content">
			<!-- TAB 1: SESSION -->
			<div id="tab-session" class="tab-pane fade show active" role="tabpanel">
				<form th:action="@{/login}" method="post" class="mt-3">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
					<div class="mb-3">
						<label for="username" class="form-label">E-Mail Address</label>
						<input id="username" name="username" type="text" class="form-control" required autocomplete="username" autofocus>
					</div>
					<div class="mb-3">
						<label for="password" class="form-label">Password</label>
						<input id="password" name="password" type="password" class="form-control" required autocomplete="current-password">
					</div>
					<button type="submit" class="btn btn-primary w-100">Login (Session)</button>
				</form>
			</div>

			<!-- TAB 2: JWT -->
			<div id="tab-jwt" class="tab-pane fade" role="tabpanel">
				<form id="jwt-login-form" class="mt-3">
					<div class="mb-3">
						<label for="jwtEmail" class="form-label">E-Mail Address</label>
						<input id="jwtEmail" name="email" type="email" class="form-control" required autocomplete="email">
					</div>
					<div class="mb-3">
						<label for="jwtPassword" class="form-label">Password</label>
						<input id="jwtPassword" name="password" type="password" class="form-control" required autocomplete="current-password">
					</div>
					<button type="submit" class="btn btn-success w-100">Login (JWT)</button>
					<div id="jwtLoginError" class="text-danger small mt-2 d-none">JWT login failed.</div>
				</form>

				<!-- Token handling -->
				<div class="mt-4">
					<label class="form-label">Access Token</label>
					<textarea id="jwtTokenBox" class="form-control" rows="4" readonly placeholder="Noch kein Token vorhanden"></textarea>
					<div class="d-flex gap-2 mt-2">
						<button class="btn btn-outline-secondary flex-fill" id="btnCopyToken" type="button">Copy Token</button>
						<button class="btn btn-outline-danger flex-fill" id="btnClearToken" type="button">Delete Token</button>
					</div>
				</div>
			</div>
		</div>

		<hr class="my-4">
		<a th:href="@{ / }" class="btn btn-secondary w-100">Return to Menu</a>
	</div>
</main>

<!-- simple inline auth helper -->
<script>
const auth = (() => {
	let token = sessionStorage.getItem('accessToken') || null;
	const setToken = t => { token = t; t ? sessionStorage.setItem('accessToken', t)
										 : sessionStorage.removeItem('accessToken'); syncUI(); };
	const getToken = () => token;
	async function apiFetch(input, init={}) {
		const headers = new Headers(init.headers || {});
		if (token) headers.set('Authorization', 'Bearer ' + token);
		return fetch(input, { ...init, headers });
	}
	function syncUI() {
		const box = document.getElementById('jwtTokenBox');
		if (box) box.value = token ?? '';
	}
	document.addEventListener('DOMContentLoaded', syncUI);
	return { setToken, getToken, apiFetch };
})();
</script>
<script>
//JWT login submit
document.getElementById('jwt-login-form')?.addEventListener('submit', async (e) => {
	e.preventDefault();
	const email = e.target.email.value.trim();
	const password = e.target.password.value;
	const err = document.getElementById('jwtLoginError');
	err.classList.add('d-none');

	try {
		const resp = await fetch('/api/auth/login', {
			method: 'POST',
			headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ email, password })
		});
		if (!resp.ok) throw new Error('bad credentials');
		const data = await resp.json(); // { accessToken, expiresIn }
		auth.setToken(data.accessToken);
		e.target.reset();
	} catch (_) {
		err.classList.remove('d-none');
	}
});

//copy/delete token
document.getElementById('btnCopyToken')?.addEventListener('click', async () => {
	const t = auth.getToken();
	if (!t) return;
	await navigator.clipboard.writeText(t);
});
document.getElementById('btnClearToken')?.addEventListener('click', () => auth.setToken(null));
</script>
</body>
</html>
