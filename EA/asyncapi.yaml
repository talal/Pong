asyncapi: '3.0.0'
info:
  title: Multiplayer Pong Game WebSocket API
  version: '1.0.0'
  description: WebSocket API for real-time communication in a multiplayer Pong game
  contact:
    name: Pong Game Dev Team
    email: support@ponggame.com
servers:
  local:
    host: localhost:8080/ws
    protocol: wss
channels:
  gameStatus:
    address: 'game/{gameId}/status'
    description: Channel for real-time game status updates
    messages:
      gameStateUpdate:
        payload:
          type: object
          properties:
            ballPosition:
              type: object
              properties:
                x:
                  type: number
                y:
                  type: number
            paddlePositions:
              type: object
              properties:
                player1:
                  type: number
                player2:
                  type: number
            score:
              type: object
              properties:
                player1:
                  type: integer
                player2:
                  type: integer
            gameStatus:
              type: string
          required:
            - ballPosition
            - paddlePositions
            - score
            - gameStatus
  playerMove:
    address: 'game/{gameId}/player/{playerId}/move'
    description: Channel for player paddle movement commands
    messages:
      paddleMovement:
        payload:
          type: object
          properties:
            direction:
              type: string
              enum:
                - up
                - down
          required:
            - direction
  heartbeat:
    address: ping
    description: Ping/Pong WebSocket heartbeat frames
    messages:
      pingMessage:
        payload:
          type: object
          properties:
            timestamp:
              type: object
              format: date-time
          required:
            - timestamp
      pongMessage:
        payload:
          type: object
          properties:
            timestamp:
              type: object
              format: date-time
          required:
            - timestamp
operations:
  receiveGameStatus:
    action: receive
    channel:
      $ref: '#/channels/gameStatus'
    summary: Subscribe to game state updates
    messages:
      - $ref: '#/channels/gameStatus/messages/gameStateUpdate'
  sendPlayerMove:
    action: send
    channel:
      $ref: '#/channels/playerMove'
    summary: Publish player paddle movement
    messages:
      - $ref: '#/channels/playerMove/messages/paddleMovement'
  sendPing:
    action: send
    channel:
      $ref: '#/channels/heartbeat'
    summary: Send ping frame
    messages:
      - $ref: '#/channels/heartbeat/messages/pingMessage'
  receivePong:
    action: receive
    channel:
      $ref: '#/channels/heartbeat'
    summary: Receive pong responses
    messages:
      - $ref: '#/channels/heartbeat/messages/pongMessage'
